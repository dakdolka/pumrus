name: Quality

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quality
          POSTGRES_USER: quality
          POSTGRES_PASSWORD: quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quality -d quality"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://quality:quality@127.0.0.1:5432/quality
      PLANNER_TEST_DATABASE_URL: postgresql+asyncpg://quality:quality@127.0.0.1:5432/quality
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: python -m compileall -q backend/app backend/alembic/versions_postgresql bot
      - run: python -m unittest discover -s backend/tests -v
        env:
          DATABASE_URL: postgresql+asyncpg://quality:quality@127.0.0.1:5432/quality
          PYTHONPATH: backend
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: quality-check-only

  bot:
    runs-on: ubuntu-latest
    env:
      TOKEN: "123456:test-bot-token"
      WEB_APP_URL: https://example.com
      API_URL: http://localhost:8000/api
      PYTHONPATH: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - run: python -m unittest discover -s bot/tests -v

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pumrus}
      - POSTGRES_USER=${POSTGRES_USER:-pumrus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pumrus} -d ${POSTGRES_DB:-pumrus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true

  postgres_backup:
    image: postgres:17-alpine
    environment:
      - PGHOST=postgres
      - PGDATABASE=${POSTGRES_DB:-pumrus}
      - PGUSER=${POSTGRES_USER:-pumrus}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./ops/backup.sh:/ops/backup.sh:ro
      - ./backups/postgres:/backups
    command: ["/bin/sh", "/ops/backup.sh"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true

  media_backup:
    image: alpine:3.22
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./ops/media-backup.sh:/ops/media-backup.sh:ro
      - media_data:/media:ro
      - ./backups/media:/backups
    command: ["/bin/sh", "/ops/media-backup.sh"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  media_init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /media"]
    volumes:
      - media_data:/media
    restart: "no"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
    networks:
      - appnet
    

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pumrus}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pumrus}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - BACKEND_INTERNAL_TOKEN=${BACKEND_INTERNAL_TOKEN:-}
      - ALLOW_INSECURE_ADMIN=${ALLOW_INSECURE_ADMIN:-false}
      - MEDIA_ROOT=/app/media
      - PAYMENT_MODE=${PAYMENT_MODE:-disabled}
      - TELEGRAM_BOT_TOKEN=${TOKEN:-}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - PAYMENT_RETURN_URL=${PAYMENT_RETURN_URL:-https://bestgreen.ru/payment/return}
      - PAYMENT_TERMS_URL=${PAYMENT_TERMS_URL:-}
      - PAYMENT_SUPPORT_URL=${PAYMENT_SUPPORT_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://bestgreen.ru,https://www.bestgreen.ru,http://localhost:3000,http://127.0.0.1:3000}
    working_dir: /app
    volumes:
      - media_data:/app/media
    command: ["sh", "-c", "alembic upgrade head && python -m app"]
    restart: unless-stopped
    ports:
    - "127.0.0.1:8000:8000"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      media_init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  tg_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      - TOKEN=${TOKEN}
      - WEB_APP_URL=${WEB_APP_URL}
      - API_URL=http://backend:8000/api
      - BACKEND_INTERNAL_TOKEN=${BACKEND_INTERNAL_TOKEN:-}
      - TG_PROXY=${TG_PROXY}
      - BOT_MODE=${BOT_MODE:-polling}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-}
      - WEBHOOK_PATH=${WEBHOOK_PATH:-/telegram/webhook}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8080
    working_dir: /app
    command: ["python", "main.py"]   # <-- вот так безопасно
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      sing-box:
          condition: service_healthy
          restart: true
      backend:
          condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8080}:8080"
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.13.12
    restart: unless-stopped
    command:
      - -D
      - /var/lib/sing-box
      - -C
      - /etc/sing-box
      - run
    volumes:
      - /etc/pumrus/sing-box:/etc/sing-box:ro
      - sing_box_data:/var/lib/sing-box
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - sing-box
        - check
        - -c
        - /etc/sing-box/config.json
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  sing_box_data:
  postgres_data:
  media_data:

networks:
  appnet:
    driver: bridge


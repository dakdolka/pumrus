services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pumrus}
      - POSTGRES_USER=${POSTGRES_USER:-pumrus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pumrus} -d ${POSTGRES_DB:-pumrus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
    

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pumrus}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pumrus}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    working_dir: /app
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.publish_curated_theory --execute && python -m app"]
    ports:
    - "8000:8000"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    networks:
      - appnet


  tg_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      - TOKEN=${TOKEN}
      - WEB_APP_URL=${WEB_APP_URL}
      - API_URL=http://backend:8000/api
      - TG_PROXY=${TG_PROXY}
      - BOT_MODE=${BOT_MODE:-polling}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-}
      - WEBHOOK_PATH=${WEBHOOK_PATH:-/telegram/webhook}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8080
    working_dir: /app
    command: ["python", "main.py"]   # <-- вот так безопасно
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      sing-box:
          condition: service_healthy
          restart: true
      backend:
          condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    networks:
      - appnet
    
  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.13.12
    restart: unless-stopped
    command:
      - -D
      - /var/lib/sing-box
      - -C
      - /etc/sing-box
      - run
    volumes:
      - /etc/pumrus/sing-box:/etc/sing-box:ro
      - sing_box_data:/var/lib/sing-box
    networks:
      - appnet
    healthcheck:
      test:
        - CMD
        - sing-box
        - check
        - -c
        - /etc/sing-box/config.json
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sing_box_data:
  postgres_data:

networks:
  appnet:
    driver: bridge

